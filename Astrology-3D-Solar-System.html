<html lang="en"><head><meta charset="utf-8">

<title>Solar System</title>
<style>

#panel .type{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.row span{color:var(--dim)} .row b{font-weight:500;text-align:right}
#x{position:absolute;right:10px;top:8px;border:0;font-size:20px;padding:2px 8px}
#focusBtn{width:100%;margin-top:12px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:var(--dim);margin-top:8px}.lg i{display:inline-block;width:20px;border-top:1.4px solid;vertical-align:middle;margin-right:5px}

body.astro #title small{color:#d9c79a}
/* perf */
.glass{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pl,.ap,.zp,.nm,#pop,#panel{visibility:hidden;transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s linear .6s}

.mk,.zl{box-shadow:none}

/* ===== v3: branding, settings, 3D chart ===== */

.sp,.ab{padding:18px 18px 14px;z-index:7;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s linear .6s}
.sp{right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);width:300px;max-height:calc(100vh - 150px);overflow:auto;transform:translateY(-10px) scale(.98)}

<body>
<canvas id="c"></canvas><div id="labels"></div>
<div id="title"><h1>SOLAR SYSTEM</h1><small>Interactive 3D model</small></div>
<div id="tr"><button class="btn" id="bSet">Settings</button><button class="btn" id="bHelp">Controls</button></div>
<div id="pop" class="glass">
 <div id="secSet"><label>Planet labels <input type="checkbox" id="cLab" checked></label><label>Orbit paths <input type="checkbox" id="cOrb" checked></label><label>Asteroid belt <input type="checkbox" id="cBelt" checked></label></div>
 <div id="secHelp" hidden><p><b>Drag</b> orbit camera</p><p><b>Wheel / pinch</b> zoom</p><p><b>Click</b> planet info</p><p><b>Double-click</b> focus planet</p></div>
</div>
<div id="panel" class="glass"><button class="btn" id="x" aria-label="Close">&times;</button><h2 id="pn"></h2><div class="type" id="pt"></div><div id="pr"></div><button class="btn" id="focusBtn">Focus camera</button></div>
<div id="bar" class="glass">
 <button class="btn" id="play" style="min-width:64px">Pause</button>
 <div class="seg" id="seg"></div>
 <input type="range" id="spd" min="0" max="10" step="0.05" value="1" aria-label="Simulation speed"><span id="sv">1×</span>
 <button class="btn" id="reset">Reset</button><button class="btn" id="sunBtn">Sun</button>
</div>
<div id="load"><div class="ldw"><img id="ld" alt="Metello logo"><b>Lionel Metello</b><span>Generating planets…</span></div></div>

<script>
(()=>{

 for(const b of bodies){b.pivot.getWorldPosition(v1);const dd=v1.distanceTo(camera.position),rad=Math.max(b.r*1.15,dd*.018),s=ray.ray.distanceSqToPoint(v1)/(rad*rad);if(s<1&&s<bs){bs=s;best=b}}return best}

/* ---------- UI ---------- */
const panel=$('panel');
function select(b){sel=b;for(const o of bodies)o.el.classList.toggle('sel',o===b);
 if(SS.astro&&SS.astro(b)){panel.classList.remove('open');return}
 if(!b){panel.classList.remove('open');return}
 $('pn').textContent=b.n;$('pt').textContent=b.type;
 $('pr').innerHTML=[['Distance from Sun',b.dist],['Diameter',b.diam],['Orbital period',b.per],['Rotation period',b.rotT],['Temperature',b.temp],['Moons',b.moons]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
 panel.classList.add('open')}
function setSpeed(v){speed=v;$('spd').value=v;$('sv').textContent=(+v).toFixed(v<1?2:v%1?1:0)+'×';[...$('seg').children].forEach(b=>b.classList.toggle('on',+b.dataset.s===+v))}
function bindUI(){
 [.25,.5,1,2,5,10].forEach(s=>{const b=document.createElement('button');b.className='btn';b.dataset.s=s;b.textContent=s+'×';b.onclick=()=>{paused=false;$('play').textContent='Pause';setSpeed(s)};$('seg').appendChild(b)});
 $('spd').oninput=e=>setSpeed(+e.target.value);setSpeed(1);
 $('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Play':'Pause'};
 $('reset').onclick=()=>setFocus(null);$('sunBtn').onclick=()=>setFocus(byName.Sun);
 $('x').onclick=()=>select(null);$('focusBtn').onclick=()=>sel&&setFocus(sel);
 const pop=$('pop');let mode='';
 const tog=m=>{const same=pop.classList.contains('show')&&mode===m;mode=m;$('secSet').hidden=m!=='set';$('secHelp').hidden=m!=='help';pop.classList.toggle('show',!same);$('bSet').classList.toggle('on',!same&&m==='set');$('bHelp').classList.toggle('on',!same&&m==='help')};
 $('bSet').onclick=()=>tog('set');$('bHelp').onclick=()=>tog('help');
 $('cLab').onchange=e=>$('labels').style.display=e.target.checked?'':'none';
 $('cOrb').onchange=e=>bodies.forEach(b=>b.orbit&&(b.orbit.visible=e.target.checked));
 $('cBelt').onchange=e=>belt.visible=e.target.checked}

function bindPointer(cv){
 const ps=new Map();let moved=0,t0=0,pinchD=0,pinchW=0,lastTap=0,lastBody=null;
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY});resetAnim=false;
  if(ps.size===1){moved=0;t0=performance.now();vYaw=vPitch=0}else if(ps.size===2){const[a,b]=[...ps.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchW=wantDist}});
 cv.addEventListener('pointermove',e=>{const p=ps.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab'}return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ps.size===1){moved+=Math.abs(dx)+Math.abs(dy);const dyaw=-dx*.0055,dp=dy*.0055;yaw+=dyaw;pitch=cl(pitch+dp,-1.5,1.5);vYaw=dyaw*.6+vYaw*.4;vPitch=dp*.6+vPitch*.4}
  else if(ps.size===2){moved+=99;const[a,b]=[...ps.values()],d=Math.hypot(a.x-b.x,a.y-b.y);wantDist=cl(pinchW*pinchD/Math.max(d,1),minDist(),900)}});
 const up=e=>{if(!ps.has(e.pointerId))return;const single=ps.size===1;ps.delete(e.pointerId);
  if(single&&moved<7&&performance.now()-t0<450){const b=pick(e.clientX,e.clientY),now=performance.now();
   if(b){if(b===lastBody&&now-lastTap<330)setFocus(b);else select(b)}else select(null);lastTap=now;lastBody=b}};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>ps.delete(e.pointerId));
 cv.addEventListener('wheel',e=>{e.preventDefault();wantDist=cl(wantDist*Math.exp(e.deltaY*(e.deltaMode?.05:.0012)),minDist(),900)},{passive:false})}

/* ---------- Main ---------- */
function init(){
 const cv=$('c');
 try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){$('load').textContent='WebGL is not available in this browser';return}
 let pr=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(pr);starU.uPR.value=pr;
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.setClearColor(0x000004);
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.05,6000);
 scene.add(new THREE.AmbientLight(0x202a44,1.1));
 buildSky();buildBodies();bindUI();bindPointer(cv);cv.style.cursor='grab';
 Object.assign(SS,{scene,camera,bodies,byName,select,days:()=>days,focused:()=>focus,setWant:v=>{wantDist=cl(v,minDist(),900)},renderer,belt,setPR:v=>{pr=v;renderer.setPixelRatio(v);starU.uPR.value=v;resize()},getPR:()=>pr});
 ring=new THREE.Mesh(new THREE.RingGeometry(.94,1,96),new THREE.MeshBasicMaterial({color:0x9cc4ff,transparent:true,opacity:.75,side:THREE.DoubleSide,depthTest:false,toneMapped:false}));ring.renderOrder=10;ring.visible=false;scene.add(ring);
 const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?62:45;camera.updateProjectionMatrix()};
 addEventListener('resize',resize);resize();
 let last=performance.now(),ema=.016,chk=0;const tanH=()=>Math.tan(camera.fov*Math.PI/360);
 function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;ema=ema*.97+dt*.03;chk+=dt;
  if(chk>2.5){chk=0;SS.dyn&&SS.dyn(ema)}
  starU.uT.value=sunU.uT.value=now/1000;
  const sp=paused?0:speed;days+=dt*sp*6;
  for(const b of bodies){
   if(b.a){b.ang=SS.ang?SS.ang(b,days):b.ph+TAU*days/b.P;b.pivot.position.set(Math.cos(b.ang)*b.a,0,-Math.sin(b.ang)*b.a)}
   b.mesh.rotation.y=b.lock?b.ang+1.57:b.mesh.rotation.y+b.rs*dt*sp}
  byName.Earth.clouds.rotation.y+=byName.Earth.rs*1.12*dt*sp;belt.rotation.y+=dt*sp*.012;
  scene.updateMatrixWorld();
  /* camera */
  if(focus)focus.pivot.getWorldPosition(goal);else goal.set(0,0,0);
  tgt.add(v1.subVectors(goal,prevGoal));prevGoal.copy(goal);tgt.lerp(goal,1-Math.exp(-dt*3));
  curDist+=(wantDist-curDist)*(1-Math.exp(-dt*4));
  if(resetAnim){const ty=.6,tp=.5;yaw+=Math.atan2(Math.sin(ty-yaw),Math.cos(ty-yaw))*(1-Math.exp(-dt*3));pitch+=(tp-pitch)*(1-Math.exp(-dt*3));if(Math.abs(pitch-tp)<.003)resetAnim=false}
  else{yaw+=vYaw;pitch=cl(pitch+vPitch,-1.5,1.5);const k=Math.exp(-dt*5);vYaw*=k;vPitch*=k}
  const cp=Math.cos(pitch);camera.position.set(tgt.x+curDist*cp*Math.sin(yaw),tgt.y+curDist*Math.sin(pitch),tgt.z+curDist*cp*Math.cos(yaw));
  camera.near=Math.max(.04,curDist*.01);camera.updateProjectionMatrix();camera.lookAt(tgt);camera.updateMatrixWorld();
  /* labels + selection */
  for(const b of bodies){b.pivot.getWorldPosition(v1);const dd=v1.distanceTo(camera.position);v2.copy(v1).project(camera);
   const rpx=b.r/(dd*tanH())*innerHeight/2;b.sx=(v2.x*.5+.5)*innerWidth;b.sy=(-v2.y*.5+.5)*innerHeight+rpx+8;
   let vis=v2.z<1&&rpx<innerHeight*.3;if(vis&&b.parent&&Math.hypot(b.sx-b.parent.sx,b.sy-b.parent.sy)<28)vis=false;
   b.el.style.opacity=vis?1:0;if(vis)b.el.style.transform=`translate(${b.sx.toFixed(1)}px,${b.sy.toFixed(1)}px) translate(-50%,0)`;
   b.el.classList.toggle('hot',b===hover)}
  if(sel){sel.pivot.getWorldPosition(v1);const dd=v1.distanceTo(camera.position);ring.visible=true;ring.position.copy(v1);ring.quaternion.copy(camera.quaternion);ring.scale.setScalar(Math.max(sel.r*1.55,dd*.022)*(1+.03*Math.sin(now/400)))}else ring.visible=false;
  SS.tick&&SS.tick(now,dt);
  renderer.render(scene,camera)}
 requestAnimationFrame(frame);
 $('load').style.opacity=0;setTimeout(()=>$('load').remove(),1000)}

addEventListener('load',()=>requestAnimationFrame(()=>setTimeout(()=>{
 try{ // generate Earth textures first so the cloud map exists before bodies are built
  init()}catch(err){console.error(err);$('load').textContent='Something went wrong: '+err.message}},40)));
})();
